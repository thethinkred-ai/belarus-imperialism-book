# Публикация HTML-версии книги в thinkred.ru/library (FTP Hoster.by) через раннер:
# локальная сеть автора блокирует исходящий 21-й порт.
# Секреты: FTP_HOSTS, FTP_USER, FTP_PASS (общие с ml-research-assistant).
name: Library deploy (FTP)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site_out/**"
      - "scripts/**"
      - ".github/workflows/library-deploy.yml"

concurrency:
  group: book-library-ftp
  cancel-in-progress: false

jobs:
  ftp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Загрузка site_out/ в /library/
        env:
          FTP_HOSTS: ${{ secrets.FTP_HOSTS }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: python scripts/ftp_deploy.py site_out /library
      - name: Обновление sitemap.xml
        env:
          FTP_HOSTS: ${{ secrets.FTP_HOSTS }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: python scripts/ftp_sitemap.py
      - name: Бэкап предыдущих версий (артефакт, 30 дней)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-ftp-backup
          path: backup/
          retention-days: 30
          if-no-files-found: ignore
